<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Empleados</title>
    <link rel="stylesheet" href="body.css">
    <link rel="stylesheet" href="empleados.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <a href="homeET24.html" class="topbar-brand">
        <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790201/img.tecN_24.png" alt="Escudo ET24" class="topbar-logo">
        <span>ET24 <strong>SHOP</strong></span>
    </a>
    <a href="homeET24.html" class="topbar-inicio">← Inicio</a>
</header>

<div class="login-box">
    <h1>🔒 Acceso Empleados</h1>
    <p>Ingresá tus datos para continuar</p>

    <div class="formulario">
        <input type="text" id="usuario" placeholder="Usuario" value="user01">
        <input type="password" id="contrasena" placeholder="Contraseña">
        <p id="error" style="color:red; display:none;">❌ Usuario o contraseña incorrectos</p>
        <button onclick="login()">Ingresar</button>
    </div>

    <br>
</div>

<script>
const BASE_URL = window.location.hostname === "localhost"
    ? "http://localhost:3000"
    : "https://express-js-on-vercel-self-omega-30.vercel.app";

async function login() {
    let usuario = document.getElementById("usuario").value.trim();
    let contrasena = document.getElementById("contrasena").value.trim();

    try {
        let respuesta = await fetch(`${BASE_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, contrasena })
        });

        let resultado = await respuesta.json();
        // ... el resto sigue igual
        if (resultado.exito) {
            localStorage.setItem("empleadoLogueado", usuario);
            window.location.href = "adminMerch.html";
        } else {
            document.getElementById("error").style.display = "block";
        }
    } catch (error) {
        console.error("Error al conectar con el servidor", error);
    }
}
</script>

</body>
</html>
