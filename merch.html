<!DOCTYPE html>
<html>
<head>
    <title>La24Shop</title>
    <link rel="stylesheet" href="body.css">
</head>
<body>

<!-- BARRA SUPERIOR FIJA -->
<header class="topbar">
    <div class="topbar-left">
        <!-- MENU -->
        <div class="menu-container">
            <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790201/img.tecN_24.png" class="menu-icon" onclick="toggleMenu()">
            <div id="menu" class="menu">
                <a href="homeET24.html">Inicio</a>
                <a href="buffet.html">Buffet</a>
                <a href="merch.html">Merchandising</a>
            </div>
        </div>
        <span class="topbar-brand">ET24 <strong>SHOP</strong></span>
    </div>

    <div class="topbar-right">
        <input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscar()">
        <button onclick="window.location.href='compra.html'" class="btn-carrito">
            🛒 <span>Ver carrito</span> <span id="contador-carrito" class="carrito-badge">0</span>
        </button>
    </div>
</header>
<!-- .topbar or .topbarleft .topbarbrand .topbarright -->

<!-- HERO -->
<section class="hero">
    <span class="hero-eyebrow">Escuela Técnica N°24</span>
    <h1>LA 24 SHOP</h1>
    <p>Productos oficiales de la ET N°24</p>
</section>

<a href="homeET24.html" class="btn-volver">← Volver</a>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrusel Nativo</title>

<!-- Carrousel, el css es body.css-->
<div class="carousel-container">
        <!-- Pistas con las imágenes -->
        <div class="carousel-track">
            <div class="carousel-slide active">
                <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790190/et24.jpg" alt="Banner 1">
            </div>
            <div class="carousel-slide">
                <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790190/et24.jpg" alt="Banner 2">
            </div>
            <div class="carousel-slide">
                <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790190/et24.jpg" alt="Banner 3">
            </div>
            <div class="carousel-slide">
                <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790190/et24.jpg" alt="Banner 4">
            </div>
            <div class="carousel-slide">
                <img src="https://res.cloudinary.com/lnjdanbc/image/upload/v1787790190/et24.jpg" alt="Banner 5">
            </div>
        </div>

        <!-- Botones de navegación (Flechas) -->
        <button class="carousel-btn prev-btn" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next-btn" id="nextBtn">&#10095;</button>

        <!-- Puntos indicadores abajo -->
        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

<!-- CATEGORÍAS — chips circulares estilo Miniso -->
<nav class="cat-chips">
    <button class="cat-chip active" data-cat="todos" onclick="filtrarCategoria('todos', this)">
        <span class="cat-chip-icon">✨</span>
        <span>Todos</span>
    </button>
    <button class="cat-chip" data-cat="indumentaria" onclick="filtrarCategoria('indumentaria', this)">
        <span class="cat-chip-icon">👕</span>
        <span>Indumentaria</span>
    </button>
    <button class="cat-chip" data-cat="tazas" onclick="filtrarCategoria('tazas', this)">
        <span class="cat-chip-icon">☕</span>
        <span>Tazas</span>
    </button>
    <button class="cat-chip" data-cat="componentes" onclick="filtrarCategoria('componentes', this)">
        <span class="cat-chip-icon">📌</span>
        <span>Componentes</span>
    </button>
</nav>

<section class="catalogo">

    <div class="categoria-bloque" data-categoria="indumentaria" id="cat-indumentaria">
        <h2 class="categoria-titulo">👕 Indumentaria</h2>
        <div class="productos" id="contenedor-indumentaria"></div>
    </div>

    <div class="categoria-bloque" data-categoria="tazas" id="cat-tazas">
        <h2 class="categoria-titulo">☕ Tazas</h2>
        <div class="productos" id="contenedor-tazas"></div>
    </div>

    <div class="categoria-bloque" data-categoria="componentes" id="cat-componentes">
        <h2 class="categoria-titulo">📌 Componentes</h2>
        <div class="productos" id="contenedor-componentes"></div>
    </div>

</section>

<script src="merch.js"></script>


</body>
</html>
