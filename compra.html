<!DOCTYPE html>
<html>
<head>
    <title>Compra</title>
    <link rel="stylesheet" href="body.css">
    <link rel="stylesheet" href="compra.css">
</head>
<body>

<div class="compra-container">
    <h1>Finalizar compra</h1>

    <div class="resumen-box">
        <h2>🛒 Tu pedido</h2>
        <ul id="listaResumen"></ul>
        <p id="totalFinal"></p>
    </div>

    <h2>Tus datos</h2>
    <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre y apellido" required>
        <input type="text" id="dni" placeholder="DNI" pattern="[0-9]{7,8}" maxlength="8" required>        <input type="text" id="curso" placeholder="Curso (ej: 3°A)" required>
        <input type="tel" id="telefono" placeholder="Teléfono" required>

        <label class="label-pago">Medio de pago</label>
        <div class="opciones-pago">
            <label class="opcion-pago">
                <input type="radio" name="pago" value="Efectivo" checked>
                💵 Efectivo
            </label>
            <label class="opcion-pago">
                <input type="radio" name="pago" value="Transferencia">
                🏦 Transferencia
            </label>
        </div>

        <button onclick="finalizarCompra()">Confirmar compra</button>
    </div>
</div>

<a href="javascript:history.back()" class="btn-volver">← Volver</a>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
let total = 0;

let lista = document.getElementById("listaResumen");
carrito.forEach((item, index) => {
    let subtotal = item.precio * item.cantidad;
    total += subtotal;
    lista.innerHTML += `
        <div class="fila-pedido">
            <span>${item.nombre} x${item.cantidad} — $${subtotal.toLocaleString('es-AR')}</span>
            <button class="btn-borrar" onclick="eliminarDelCarrito(${index})">🗑️</button>
        </div>
    `;
});
document.getElementById("totalFinal").innerHTML = "<strong>Total: $" + total.toLocaleString('es-AR') + "</strong>";
function eliminarDelCarrito(index) {
    carrito.splice(index, 1);
    localStorage.setItem("carrito", JSON.stringify(carrito));
    location.reload(); // Recarga la página para refrescar la lista y el total
}
async function finalizarCompra() {
    // 1. Obtener valores de los campos del formulario
    let nombre = document.getElementById("nombre").value.trim();
    let dni = document.getElementById("dni").value.trim();
    let curso = document.getElementById("curso").value.trim();
    let telefono = document.getElementById("telefono").value.trim();
    let pagoInput = document.querySelector('input[name="pago"]:checked');

    // Validación de campos vacíos
    if (!nombre || !dni || !curso || !telefono || !pagoInput) {
        alert("Por favor, completa todos los datos del formulario antes de finalizar.");
        return;
    }

    if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
    }

    // Calcular total acumulado
    let totalAcumulado = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

    // Estructura de datos a enviar
    const pedidoData = {
        cliente: {
            nombre: nombre,
            dni: dni,
            curso: curso,
            telefono: telefono,
            pago: pagoInput.value
        },
        productos: carrito,
        total: totalAcumulado
    };

    try {
        // Enviar la orden al servidor backend
        const respuesta = await fetch('http://localhost:3000/api/pedidos', { // Reemplazar por URL de Render en producción
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(pedidoData)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
            alert(`¡Pedido #${resultado.idPedido} guardado con éxito! Gracias por tu compra.`);
            
            // Vaciar el carrito en pantalla y memoria
            carrito = [];
            localStorage.removeItem("carrito");
            location.reload();
        } else {
            alert("Hubo un problema al procesar el pedido: " + resultado.error);
        }
    } catch (error) {
        console.error("Error en la petición:", error);
        alert("No se pudo conectar con el servidor para guardar la compra.");
    }
}
</script>

</body>
</html>
