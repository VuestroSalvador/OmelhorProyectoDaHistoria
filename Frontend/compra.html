<!DOCTYPE html>
<html>
<head>
    <title>Compra</title>
    <link rel="stylesheet" href="../estilo/body.css">
    <link rel="stylesheet" href="../estilo/compra.css">
</head>
<body>

<div class="compra-container">
    <h1>Finalizar compra</h1>

    <div class="resumen-box">
        <h2>🛒 Tu pedido</h2>
        <ul id="listaResumen"></ul>
        <p id="totalFinal"></p>
    </div>

    <h2>Tus datos</h2>
    <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre y apellido" required>
        <input type="text" id="dni" placeholder="DNI" pattern="[0-9]{7,8}" maxlength="8" required>
        <input type="text" id="curso" placeholder="Curso (6°6°)" required>
        <input type="tel" id="telefono" placeholder="Teléfono" required>

        <label class="label-pago">Medio de pago</label>
        <div class="opciones-pago">
            <label class="opcion-pago">
                <input type="radio" name="pago" value="Efectivo" checked>
                💵 Efectivo
            </label>
            <label class="opcion-pago">
                <input type="radio" name="pago" value="Transferencia">
                🏦 Transferencia
            </label>
        </div>

        <button onclick="finalizarCompra()">Confirmar compra</button>
    </div>
</div>

<a href="javascript:history.back()" class="btn-volver">← Volver</a>

<script src="../javascripts/compra.js"></script>

</body>
</html>
